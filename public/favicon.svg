<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The four-pointed star the app already uses beside the guide, on the ink the
    whole interface is drawn on.

    An earlier version put a horizon line across a brass bezel with a star above
    it. At 48 pixels it read as a smiling face and at 16 it read as nothing at
    all, which is the usual fate of an icon designed at the size it is drawn
    rather than the size it is seen. This is one shape with a hard edge, and it
    survives being three pixels across.
  -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8cc7a" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#c9a227" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#c9a227" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="#07070f" />

  <!-- Two faint companions, so the ground is a sky rather than a backdrop.
       They vanish below about 32 pixels, which is intended. -->
  <circle cx="14" cy="15" r="1.6" fill="#f2ede0" opacity="0.5" />
  <circle cx="50" cy="49" r="1.3" fill="#f2ede0" opacity="0.38" />

  <circle cx="32" cy="32" r="26" fill="url(#halo)" />

  <path
    d="M32 6 C33.9 22.4 41.6 30.1 58 32 C41.6 33.9 33.9 41.6 32 58 C30.1 41.6 22.4 33.9 6 32 C22.4 30.1 30.1 22.4 32 6 Z"
    fill="#f2ede0"
  />
</svg>
