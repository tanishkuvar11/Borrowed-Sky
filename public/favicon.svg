<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The four-pointed star the app already uses beside the guide, cut out of
    brass rather than drawn on ink.

    Struck rather than printed: the mark is the absence, the way it would be on
    an instrument's bezel, and the gradient runs corner to corner so the plate
    has a direction to catch light from.

    Drawn for sixteen pixels. An earlier version put a horizon line across a
    bezel with a star above it, which at forty eight pixels read as a smiling
    face and at sixteen read as nothing at all. One shape with a hard edge is
    what survives a tab strip.
  -->
  <defs>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8cc7a" />
      <stop offset="52%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#a8851c" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="13" fill="url(#brass)" />

  <path
    d="M32 6 C33.9 22.4 41.6 30.1 58 32 C41.6 33.9 33.9 41.6 32 58 C30.1 41.6 22.4 33.9 6 32 C22.4 30.1 30.1 22.4 32 6 Z"
    fill="#07070f"
  />
</svg>
