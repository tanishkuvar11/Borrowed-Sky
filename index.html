<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A0A18" />
    <meta
      name="description"
      content="Borrowed Sky: a zero-install sky companion that tells you what is overhead right now, wherever you are. No telescope, no app, no prior knowledge needed."
    />
    <title>Borrowed Sky</title>

    <!--
      An SVG favicon, so the star stays a hard edge at every size a browser
      asks for rather than a resampled 32-pixel bitmap. The touch icon is a
      raster because iOS will not take an SVG for the home screen.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Three faces, three jobs. Cormorant Garamond speaks and narrates, italic
      included for the emphasised words. Unbounded stamps the engraved labels
      and controls, and Share Tech Mono prints every number.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Unbounded:wght@300..800&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <!--
      The ground colour, painted before anything else can be.

      This is inline and not in the stylesheet on purpose. The stylesheet is a
      module the bundle imports, so on a cold load it arrives with the
      JavaScript, and until then the page is whatever white the browser starts
      with. One frame of white in front of a page about the night sky is the
      single worst frame the app can show, and it is the one it used to open on.

      The curtain over #root is the other half of boot(): the app is not shown
      while it is still assembling itself out of missing pieces, and `is-ready`
      is set on the root element once there is a finished page underneath. The
      fade is short and only exists so the reveal does not read as a jump cut.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #0a0a18;
      }

      #root {
        opacity: 0;
      }

      html.is-ready #root {
        opacity: 1;
        transition: opacity 260ms ease-out;
      }

      /*
        If the script never runs there is nothing to wait for, and a permanently
        invisible page is worse than an unstyled one.
      */
      @media (scripting: none) {
        #root {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Borrowed Sky computes the sky in your browser and needs JavaScript enabled.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
